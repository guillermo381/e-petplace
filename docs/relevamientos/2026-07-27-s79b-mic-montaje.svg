<svg xmlns="http://www.w3.org/2000/svg" width="680" height="560" viewBox="0 0 680 560" font-family="Menlo, monospace">
  <!--
    S79-B · TANDA 1 (B2) — EL MONTAJE DEL MICRÓFONO (DIRECCION_ARTE §6b punto 4).
    Gate POR ÍCONO pendiente desde S78 (§6bis). El glifo vive en
    apps/prestador/src/components/dictado-en-vivo.tsx:197-214 (trazo 1.9,
    remates redondeados, SIN huella — es glifo de CONTROL, como el chevron;
    la decisión de si exige huella es del founder en el gate).
    Vecindad elegida: la de la consulta vet (veterinaria · caso · presupuesto ·
    carnet) + paseo como testigo de otra capa.
    Estados del mic: reposo (tinta) · escuchando (accent.primary del tema:
    tealDark #0A7268 claro / teal #28E8DA oscuro — el literal del componente).
    Huellas en hex PURO de capa (registro 'capa'): identidad #2BE86B ·
    cuidado #28E8DA · ocre #E8B547.
  -->
  <defs>
    <g id="huella">
      <ellipse cx="12" cy="15.7" rx="5.7" ry="4.7"/>
      <ellipse cx="12" cy="5.9" rx="2.8" ry="3.5"/>
      <ellipse cx="5.7" cy="8.3" rx="2.5" ry="3.2" transform="rotate(-24 5.7 8.3)"/>
      <ellipse cx="18.3" cy="8.3" rx="2.5" ry="3.2" transform="rotate(24 18.3 8.3)"/>
    </g>

    <g id="g-mic" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" fill="none">
      <path d="M12 3.2a2.9 2.9 0 0 1 2.9 2.9v5a2.9 2.9 0 0 1-5.8 0v-5A2.9 2.9 0 0 1 12 3.2Z"/>
      <path d="M5.8 11.1a6.2 6.2 0 0 0 12.4 0M12 17.3v3.2"/>
    </g>

    <g id="g-veterinaria">
      <g stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" fill="none">
        <path d="M7.2 3v3.5a4.8 4.8 0 0 0 9.6 0V3"/>
        <path d="M12 11.3v2.1c0 2.8-1 4.8-3.1 4.8"/>
        <circle cx="6.6" cy="18.2" r="2.3"/>
      </g>
      <use href="#huella" transform="translate(12.6 12.4) scale(0.46)" fill="#2BE86B"/>
    </g>

    <g id="g-caso">
      <g stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" fill="none">
        <path d="M3.6 18.3V6.2a1.5 1.5 0 0 1 1.5-1.5h3.7l1.9 2.2h7.7a1.5 1.5 0 0 1 1.5 1.5v9.9a1.5 1.5 0 0 1-1.5 1.5H5.1a1.5 1.5 0 0 1-1.5-1.5Z"/>
      </g>
      <use href="#huella" transform="translate(8.9 10.2) scale(0.38)" fill="#2BE86B"/>
    </g>

    <g id="g-presupuesto">
      <g stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" fill="none">
        <path d="M6.2 3.6h7.6l4.6 4.6V19a1.5 1.5 0 0 1-1.5 1.5H6.2A1.5 1.5 0 0 1 4.7 19V5.1a1.5 1.5 0 0 1 1.5-1.5Z"/>
        <path d="M13.8 3.6v4.6h4.6"/>
        <path d="M8 12.2h5M8 15.2h3.4"/>
      </g>
      <use href="#huella" transform="translate(12.4 13.6) scale(0.32)" fill="#E8B547"/>
    </g>

    <g id="g-carnet">
      <g stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" fill="none">
        <path d="M18.2 2.8l3 3M16.4 7.6l1.7-1.7"/>
        <path d="M14 5.2l4.8 4.8-7.4 7.4H6.6v-4.8Z"/>
      </g>
      <use href="#huella" transform="translate(3.4 14.6) scale(0.36)" fill="#2BE86B"/>
    </g>

    <g id="g-paseo">
      <g stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" fill="none">
        <circle cx="17" cy="5.4" r="2.5"/>
        <path d="M16.7 7.8c1.1 3.4-2.7 4.6-5.8 5.4"/>
      </g>
      <use href="#huella" transform="translate(1.6 12.2) scale(0.47)" fill="#28E8DA"/>
    </g>
  </defs>

  <!-- ═══════════ PANEL CLARO — papel algodón ═══════════ -->
  <rect x="0" y="0" width="680" height="280" fill="#FAF9F7"/>
  <text x="24" y="34" font-size="13" fill="#1D1A2E">claro · papel #FAF9F7 · tinta #1D1A2E · activo tealDark #0A7268</text>

  <!-- fila 44px -->
  <text x="24" y="106" font-size="11" fill="#6B6880">44px</text>
  <g transform="translate(88 66)"  color="#1D1A2E"><g transform="scale(1.8333)"><use href="#g-mic"/></g></g>
  <g transform="translate(168 66)" color="#0A7268"><g transform="scale(1.8333)"><use href="#g-mic"/></g></g>
  <g transform="translate(248 66)" color="#1D1A2E"><g transform="scale(1.8333)"><use href="#g-veterinaria"/></g></g>
  <g transform="translate(328 66)" color="#1D1A2E"><g transform="scale(1.8333)"><use href="#g-caso"/></g></g>
  <g transform="translate(408 66)" color="#1D1A2E"><g transform="scale(1.8333)"><use href="#g-presupuesto"/></g></g>
  <g transform="translate(488 66)" color="#1D1A2E"><g transform="scale(1.8333)"><use href="#g-carnet"/></g></g>
  <g transform="translate(568 66)" color="#1D1A2E"><g transform="scale(1.8333)"><use href="#g-paseo"/></g></g>

  <!-- fila 21px (tamaño tab — Ley 9: la huella sobrevive o es ruido) -->
  <text x="24" y="176" font-size="11" fill="#6B6880">21px</text>
  <g transform="translate(99.5 160)"  color="#1D1A2E"><g transform="scale(0.875)"><use href="#g-mic"/></g></g>
  <g transform="translate(179.5 160)" color="#0A7268"><g transform="scale(0.875)"><use href="#g-mic"/></g></g>
  <g transform="translate(259.5 160)" color="#1D1A2E"><g transform="scale(0.875)"><use href="#g-veterinaria"/></g></g>
  <g transform="translate(339.5 160)" color="#1D1A2E"><g transform="scale(0.875)"><use href="#g-caso"/></g></g>
  <g transform="translate(419.5 160)" color="#1D1A2E"><g transform="scale(0.875)"><use href="#g-presupuesto"/></g></g>
  <g transform="translate(499.5 160)" color="#1D1A2E"><g transform="scale(0.875)"><use href="#g-carnet"/></g></g>
  <g transform="translate(579.5 160)" color="#1D1A2E"><g transform="scale(0.875)"><use href="#g-paseo"/></g></g>

  <!-- rótulos -->
  <g font-size="10" fill="#6B6880" text-anchor="middle">
    <text x="110" y="228">mic</text>
    <text x="190" y="228">mic·activo</text>
    <text x="270" y="228">veterinaria</text>
    <text x="350" y="228">caso</text>
    <text x="430" y="228">presupuesto</text>
    <text x="510" y="228">carnet</text>
    <text x="590" y="228">paseo</text>
  </g>
  <text x="24" y="258" font-size="10" fill="#6B6880">el mic NO lleva huella (glifo de CONTROL, como el chevron) — si exige huella lo decide el gate</text>

  <!-- ═══════════ PANEL OSCURO ═══════════ -->
  <rect x="0" y="280" width="680" height="280" fill="#050508"/>
  <text x="24" y="314" font-size="13" fill="#F0EEF8">oscuro · base #050508 · tinta #F0EEF8 · activo teal #28E8DA</text>

  <!-- fila 44px -->
  <text x="24" y="386" font-size="11" fill="#8B88A0">44px</text>
  <g transform="translate(88 346)"  color="#F0EEF8"><g transform="scale(1.8333)"><use href="#g-mic"/></g></g>
  <g transform="translate(168 346)" color="#28E8DA"><g transform="scale(1.8333)"><use href="#g-mic"/></g></g>
  <g transform="translate(248 346)" color="#F0EEF8"><g transform="scale(1.8333)"><use href="#g-veterinaria"/></g></g>
  <g transform="translate(328 346)" color="#F0EEF8"><g transform="scale(1.8333)"><use href="#g-caso"/></g></g>
  <g transform="translate(408 346)" color="#F0EEF8"><g transform="scale(1.8333)"><use href="#g-presupuesto"/></g></g>
  <g transform="translate(488 346)" color="#F0EEF8"><g transform="scale(1.8333)"><use href="#g-carnet"/></g></g>
  <g transform="translate(568 346)" color="#F0EEF8"><g transform="scale(1.8333)"><use href="#g-paseo"/></g></g>

  <!-- fila 21px -->
  <text x="24" y="456" font-size="11" fill="#8B88A0">21px</text>
  <g transform="translate(99.5 440)"  color="#F0EEF8"><g transform="scale(0.875)"><use href="#g-mic"/></g></g>
  <g transform="translate(179.5 440)" color="#28E8DA"><g transform="scale(0.875)"><use href="#g-mic"/></g></g>
  <g transform="translate(259.5 440)" color="#F0EEF8"><g transform="scale(0.875)"><use href="#g-veterinaria"/></g></g>
  <g transform="translate(339.5 440)" color="#F0EEF8"><g transform="scale(0.875)"><use href="#g-caso"/></g></g>
  <g transform="translate(419.5 440)" color="#F0EEF8"><g transform="scale(0.875)"><use href="#g-presupuesto"/></g></g>
  <g transform="translate(499.5 440)" color="#F0EEF8"><g transform="scale(0.875)"><use href="#g-carnet"/></g></g>
  <g transform="translate(579.5 440)" color="#F0EEF8"><g transform="scale(0.875)"><use href="#g-paseo"/></g></g>

  <g font-size="10" fill="#8B88A0" text-anchor="middle">
    <text x="110" y="508">mic</text>
    <text x="190" y="508">mic·activo</text>
    <text x="270" y="508">veterinaria</text>
    <text x="350" y="508">caso</text>
    <text x="430" y="508">presupuesto</text>
    <text x="510" y="508">carnet</text>
    <text x="590" y="508">paseo</text>
  </g>
  <text x="24" y="538" font-size="10" fill="#8B88A0">huellas en hex PURO de capa (registro 'capa'): identidad #2BE86B · cuidado #28E8DA · ocre #E8B547</text>
</svg>
